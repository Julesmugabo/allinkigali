<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Amakuru n'ubucuruzi bwo mu Rwanda — Kinyarwanda news and a local services marketplace." />

    <!-- Makes the site installable as an app (Android/Chrome: an automatic
         install prompt; iOS Safari: Share -> Add to Home Screen). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#042C53" />
    <link rel="icon" href="/favicon.png" />

    <!-- iOS ignores the web manifest for home-screen icons/standalone mode
         — these tags are what it actually reads instead. -->
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="allinkigali" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height. The background colour is a
         backstop against the same white-flash bug App.js's root View fixes —
         this covers the moment before React has painted anything. */
      html,
      body {
        height: 100%;
        background-color: #042c53;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
